# Setup monitors
monitor=,preferred,auto,1

# Environment Variables for Hyprland & Wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11,*
env = CLUTTER_BACKEND,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Execute core environment and services at launch
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = quickshell
exec-once = swaybg -m fill -i ~/.config/hypr/hong-kong-night.jpg

# Input configurations
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
        tap-and-drag = true
        drag_lock = false
        disable_while_typing = true
        scroll_factor = 1.0
        middle_button_emulation = false
    }

    sensitivity = 0
}

general {
    gaps_in = 4
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(58a6ff)
    col.inactive_border = rgba(1f2430aa)

    layout = dwindle
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

# 8GB RAM & GPU friendly decoration tweaks (Near-Black Minimal)
decoration {
    rounding = 8

    blur {
        enabled = true
        size = 4
        passes = 2
    }

    shadow {
        enabled = false
    }
}

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 5, myBezier
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 8, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, default
}

dwindle {
    preserve_split = true
}

# Window Rules (Hyprland modern regex)
windowrulev2 = opacity 0.95 0.90, class:^(com\.mitchellh\.ghostty)$
windowrulev2 = opacity 0.98 0.92, class:^(org\.gnome\.Nautilus)$

$mainMod = SUPER

# Keybinds
bind = $mainMod, T, exec, ghostty
bind = $mainMod, B, exec, microsoft-edge-stable
bind = $mainMod SHIFT, X, killactive
bind = $mainMod, L, exec, swaylock
bind = $mainMod, M, exec, quickshell ipc call shell togglePowerMenu
bind = $mainMod, C, exec, quickshell ipc call shell toggleControlCenter
bind = $mainMod SHIFT, M, exit
bind = $mainMod, E, exec, nautilus
bind = $mainMod, V, togglefloating
bind = $mainMod, SPACE, exec, fuzzel
bind = $mainMod, P, pseudo
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, S, exec, grim -g "$(slurp)" - | swappy -f -

# Audio and Brightness hardware keys
bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5
bind = , XF86AudioMicMute, exec, pamixer --default-source -t
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-
bind = , XF86MonBrightnessUp, exec, brightnessctl set 10%+

# ASUS / ROG specific keys (graceful fallback)
bind = , 156, exec, command -v rog-control-center >/dev/null && rog-control-center
bind = , 211, exec, command -v asusctl >/dev/null && asusctl profile -n
bind = , 237, exec, brightnessctl -d asus::kbd_backlight set 33%-
bind = , 238, exec, brightnessctl -d asus::kbd_backlight set 33%+
bind = , 210, exec, command -v asusctl >/dev/null && asusctl led-mode -n

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
